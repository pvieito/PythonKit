name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  continuous-integration:
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      !contains(github.event.head_commit.message || '', '[SKIP-CI]') &&
      !contains(github.event.pull_request.title || '', '[SKIP-CI]')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            xcode: "26.0.1"
          - os: macos-latest
            xcode: latest-stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set Up Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Select Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Show Swift Version
        run: swift --version
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Configure PythonKit
        shell: bash
        run: |
          python_library="$(find -L "$pythonLocation" \( -name 'libpython3.13*.dylib' -o -name 'libpython3.13*.so' \) -print -quit)"
          test -n "$python_library"
          echo "PYTHON_LIBRARY=$python_library" >> "$GITHUB_ENV"
      - name: Test
        run: swift test --enable-test-discovery
        if: runner.os != 'Windows'
        env:
          PYTHON_LOADER_LOGGING: TRUE
